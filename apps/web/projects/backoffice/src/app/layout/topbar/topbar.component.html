<header
  class="sticky top-0 z-10 flex h-14 items-center gap-3 border-b border-slate-200 bg-white px-4"
>
  <button
    type="button"
    (click)="menuClick.emit()"
    aria-label="Menü öffnen"
    class="-ml-1 rounded-lg p-1.5 text-slate-500 hover:bg-slate-100 lg:hidden"
  >
    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4" x2="20" y1="6" y2="6" />
      <line x1="4" x2="20" y1="12" y2="12" />
      <line x1="4" x2="20" y1="18" y2="18" />
    </svg>
  </button>

  <h1 class="truncate text-sm font-semibold text-slate-900">
    {{ pageTitle() }}
  </h1>

  <div class="ml-auto flex items-center gap-3">
    <span class="hidden text-sm text-slate-600 sm:inline">
      {{ auth.user()?.firstName }} {{ auth.user()?.lastName }}
    </span>
    <bo-button variant="secondary" size="sm" (click)="auth.logout()">
      Abmelden
    </bo-button>
  </div>
</header>

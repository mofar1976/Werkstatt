<div class="mx-auto max-w-xl space-y-4">
  <a routerLink="/car-catalog" class="text-sm text-brand-600 hover:underline">
    ← Zurück zur Liste
  </a>

  <h1 class="text-lg font-semibold text-slate-900">
    {{ isEdit() ? "Marke bearbeiten" : "Neue Marke" }}
  </h1>

  @if (facade.detailError(); as error) {
    <bo-alert variant="error">{{ error }}</bo-alert>
  }

  <form
    class="space-y-5 rounded-xl border border-slate-200 bg-white p-6"
    [formGroup]="form"
    (ngSubmit)="submit()"
  >
    <bo-text-field
      [control]="form.controls.name"
      label="Name"
      placeholder="z. B. BMW"
    />

    <p class="text-xs text-slate-400">
      Logo und Modelle können nach dem Anlegen auf der Detailseite gepflegt werden.
    </p>

    <div class="flex items-center gap-3 pt-2">
      <bo-button type="submit" [loading]="facade.saving()">
        {{ isEdit() ? "Speichern" : "Anlegen" }}
      </bo-button>
      <a routerLink="/car-catalog" class="text-sm text-slate-500 hover:text-slate-700">
        Abbrechen
      </a>
    </div>
  </form>
</div>

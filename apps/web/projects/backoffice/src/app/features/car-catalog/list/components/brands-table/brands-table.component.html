<div class="overflow-x-auto">
  <table class="w-full text-sm">
    <thead>
      <tr class="border-b border-slate-200 text-left text-xs font-medium uppercase tracking-wide text-slate-400">
        <th class="px-4 py-3">Logo</th>
        <th class="px-4 py-3">Marke</th>
        <th class="px-4 py-3 text-right">Modelle</th>
        <th class="px-4 py-3">Angelegt</th>
      </tr>
    </thead>
    <tbody>
      @for (brand of brands(); track brand.id) {
        <tr class="border-b border-slate-100 last:border-0 hover:bg-slate-50">
          <td class="px-4 py-3">
            <div class="flex h-10 w-10 items-center justify-center overflow-hidden rounded-lg border border-slate-200 bg-slate-50 p-1">
              @if (brand.logoUrl) {
                <img [src]="brand.logoUrl" [alt]="brand.name" class="h-full w-full object-contain" />
              } @else {
                <span class="text-xs font-semibold text-slate-400">
                  {{ brand.name.slice(0, 2).toUpperCase() }}
                </span>
              }
            </div>
          </td>
          <td class="px-4 py-3">
            <a
              [routerLink]="['/car-catalog', brand.id]"
              class="font-medium text-slate-900 hover:text-brand-600"
            >
              {{ brand.name }}
            </a>
            <div class="text-xs text-slate-400">{{ brand.slug }}</div>
          </td>
          <td class="px-4 py-3 text-right tabular-nums text-slate-600">
            {{ brand.modelCount }}
          </td>
          <td class="px-4 py-3 text-slate-500">
            {{ brand.createdAt | date: "dd.MM.yyyy" }}
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>

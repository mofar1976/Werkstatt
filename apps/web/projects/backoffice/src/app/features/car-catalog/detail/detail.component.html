<div class="space-y-4">
  <a routerLink="/car-catalog" class="text-sm text-brand-600 hover:underline">
    ← Zurück zur Liste
  </a>

  @if (facade.detailError(); as error) {
    <bo-alert variant="error">{{ error }}</bo-alert>
  }

  @if (facade.detailLoading() && !brand()) {
    <div class="flex justify-center rounded-xl border border-slate-200 bg-white p-10 text-sm text-slate-400">
      <bo-spinner label="Lädt …" />
    </div>
  } @else if (brand(); as b) {
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-lg font-semibold text-slate-900">{{ b.name }}</h1>
        <p class="text-xs text-slate-400">{{ b.slug }}</p>
      </div>
      <div class="flex items-center gap-2">
        <bo-button variant="secondary" size="sm" [routerLink]="['/car-catalog', b.id, 'edit']">
          Bearbeiten
        </bo-button>
        <bo-button variant="danger" size="sm" (click)="remove()">Löschen</bo-button>
      </div>
    </div>

    <bo-brand-logo [brandId]="b.id" [logoUrl]="b.logoUrl" [saving]="facade.saving()" />

    <bo-brand-models [brandId]="b.id" [models]="facade.models()" [saving]="facade.saving()" />
  }
</div>

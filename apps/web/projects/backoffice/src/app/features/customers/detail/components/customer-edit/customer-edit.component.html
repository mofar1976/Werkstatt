<form
  class="space-y-5 rounded-xl border border-slate-200 bg-white p-6"
  [formGroup]="form"
  (ngSubmit)="submit()"
>
  <div class="grid gap-5 sm:grid-cols-2">
    <bo-text-field [control]="form.controls.firstName" label="Vorname" />
    <bo-text-field [control]="form.controls.lastName" label="Nachname" />
  </div>
  <bo-text-field [control]="form.controls.phone" label="Telefon" type="tel" />

  <p class="text-xs text-slate-400">
    Die E-Mail-Adresse kann nicht geändert werden.
  </p>

  <div class="flex items-center gap-3 pt-2">
    <bo-button type="submit" [loading]="saving()">Speichern</bo-button>
    <button
      type="button"
      class="text-sm text-slate-500 hover:text-slate-700"
      (click)="cancel.emit()"
    >
      Abbrechen
    </button>
  </div>
</form>

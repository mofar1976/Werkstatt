<div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
  <div class="flex items-center justify-between">
    <h2 class="text-sm font-semibold text-slate-900">
      Freischaltung ausstehend
    </h2>
    <a routerLink="/workshops" class="text-xs font-medium text-brand-600 hover:underline">
      Alle Werkstätten
    </a>
  </div>

  @if (workshops().length === 0) {
    <p class="mt-4 text-sm text-slate-400">
      Keine Werkstätten warten auf Freischaltung.
    </p>
  } @else {
    <ul class="mt-3 divide-y divide-slate-100">
      @for (workshop of workshops(); track workshop.id) {
        <li>
          <a
            [routerLink]="['/workshops', workshop.id]"
            class="flex items-center justify-between gap-3 py-3 transition hover:opacity-80"
          >
            <span class="min-w-0">
              <span class="block text-sm font-medium text-slate-800">
                {{ workshop.name }}
              </span>
              <span class="block text-xs text-slate-500">{{ workshop.city }}</span>
            </span>
            <span class="shrink-0 text-xs text-slate-400">
              {{ workshop.createdAt | date: "dd.MM.yyyy" }}
            </span>
          </a>
        </li>
      }
    </ul>
  }
</div>

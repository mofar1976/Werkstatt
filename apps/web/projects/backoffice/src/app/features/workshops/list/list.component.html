<div class="space-y-4">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <bo-workshops-toolbar
      (searchChange)="facade.setSearch($event)"
      (statusChange)="facade.setStatus($event)"
    />
    <bo-button routerLink="/workshops/new">Neue Werkstatt</bo-button>
  </div>

  @if (facade.error(); as error) {
    <bo-alert variant="error">{{ error }}</bo-alert>
  }

  <div class="overflow-hidden rounded-xl border border-slate-200 bg-white">
    @if (facade.loading() && facade.items().length === 0) {
      <div class="flex justify-center p-10 text-sm text-slate-400">
        <bo-spinner label="Lädt …" />
      </div>
    } @else if (facade.items().length === 0) {
      <div class="p-10 text-center text-sm text-slate-500">
        Keine Werkstätten gefunden.
      </div>
    } @else {
      <bo-workshops-table [workshops]="facade.items()" />
    }
  </div>

  <bo-pagination
    [page]="facade.page()"
    [pageSize]="facade.pageSize()"
    [total]="facade.total()"
    (pageChange)="facade.setPage($event)"
  />
</div>

<div class="mx-auto max-w-2xl space-y-4">
  <a routerLink="/workshops" class="text-sm text-brand-600 hover:underline">
    ← Zurück zur Liste
  </a>

  <h1 class="text-lg font-semibold text-slate-900">
    {{ isEdit() ? "Werkstatt bearbeiten" : "Neue Werkstatt" }}
  </h1>

  @if (facade.detailError(); as error) {
    <bo-alert variant="error">{{ error }}</bo-alert>
  }

  <form
    class="space-y-5 rounded-xl border border-slate-200 bg-white p-6"
    [formGroup]="form"
    (ngSubmit)="submit()"
  >
    <bo-text-field
      [control]="form.controls.name"
      label="Name"
      placeholder="z. B. Autohaus Nord"
    />

    <div>
      <label class="mb-1.5 block text-sm font-medium text-slate-700" for="desc">
        Beschreibung
      </label>
      <textarea
        id="desc"
        rows="3"
        formControlName="description"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100"
      ></textarea>
    </div>

    <div class="grid gap-5 sm:grid-cols-2">
      <bo-text-field [control]="form.controls.email" label="E-Mail" type="email" icon="mail" />
      <bo-text-field [control]="form.controls.phone" label="Telefon" type="tel" />
    </div>

    <fieldset formGroupName="address" class="grid gap-5 sm:grid-cols-2">
      <legend class="mb-1 text-sm font-semibold text-slate-900">Adresse</legend>
      <bo-text-field [control]="form.controls.address.controls.street" label="Straße & Nr." />
      <bo-text-field [control]="form.controls.address.controls.city" label="Stadt" />
      <bo-text-field [control]="form.controls.address.controls.postalCode" label="PLZ" />
      <bo-text-field [control]="form.controls.address.controls.country" label="Land (ISO-2)" />
    </fieldset>

    <div class="grid gap-5 sm:grid-cols-2">
      <div>
        <label class="mb-1.5 block text-sm font-medium text-slate-700" for="lat">Breite (lat)</label>
        <input id="lat" type="number" step="any" formControlName="lat"
          class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100" />
      </div>
      <div>
        <label class="mb-1.5 block text-sm font-medium text-slate-700" for="lng">Länge (lng)</label>
        <input id="lng" type="number" step="any" formControlName="lng"
          class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100" />
      </div>
    </div>

    <div class="flex items-center gap-3 pt-2">
      <bo-button type="submit" [loading]="facade.saving()">
        {{ isEdit() ? "Speichern" : "Anlegen" }}
      </bo-button>
      <a routerLink="/workshops" class="text-sm text-slate-500 hover:text-slate-700">
        Abbrechen
      </a>
    </div>
  </form>
</div>

<div class="flex flex-wrap items-center gap-2">
  <div class="relative min-w-[220px] flex-1">
    <svg
      class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"
      viewBox="0 0 20 20"
      fill="currentColor"
      aria-hidden="true"
    >
      <path
        fill-rule="evenodd"
        d="M9 3.5a5.5 5.5 0 1 0 3.472 9.77l3.879 3.88a.75.75 0 1 0 1.06-1.06l-3.878-3.88A5.5 5.5 0 0 0 9 3.5ZM5 9a4 4 0 1 1 8 0 4 4 0 0 1-8 0Z"
        clip-rule="evenodd"
      />
    </svg>
    <input
      type="search"
      [value]="search()"
      (input)="onSearch($any($event.target).value)"
      placeholder="Werkstatt oder Stadt suchen"
      class="w-full rounded-lg border border-slate-300 bg-white py-2.5 pl-9 pr-3 text-sm text-slate-900 shadow-sm outline-none transition placeholder:text-slate-400 focus:border-brand-500 focus:ring-2 focus:ring-brand-100"
    />
  </div>

  @if (near()) {
    <label class="flex items-center gap-2 text-sm text-slate-600">
      Umkreis
      <select
        [value]="radiusKm()"
        (change)="onRadius($any($event.target).value)"
        class="rounded-lg border border-slate-300 bg-white px-2 py-2.5 text-sm text-slate-700 shadow-sm outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100"
      >
        @for (km of radiusOptions; track km) {
          <option [value]="km">{{ km }} km</option>
        }
      </select>
    </label>
    <button
      type="button"
      class="inline-flex items-center rounded-lg px-2.5 py-1.5 text-xs font-semibold text-slate-600 transition hover:bg-slate-100"
      (click)="clearNear.emit()"
    >
      Umkreis-Suche zurücksetzen
    </button>
  }
</div>

<div class="relative overflow-hidden rounded-xl border border-slate-200">
  <div #map class="h-[420px] w-full lg:h-[560px]"></div>

  @if (showControls()) {
  <div class="pointer-events-none absolute inset-x-0 top-0 z-[500] flex flex-wrap justify-end gap-2 p-3">
    <button
      type="button"
      class="pointer-events-auto inline-flex items-center gap-1.5 rounded-lg border border-slate-300 bg-white/95 px-3 py-1.5 text-xs font-semibold text-slate-700 shadow-sm backdrop-blur transition hover:bg-white"
      (click)="locateMe()"
    >
      @if (locating()) {
        Standort wird ermittelt …
      } @else {
        Meine Position
      }
    </button>
    <button
      type="button"
      class="pointer-events-auto inline-flex items-center gap-1.5 rounded-lg border border-slate-300 bg-white/95 px-3 py-1.5 text-xs font-semibold text-slate-700 shadow-sm backdrop-blur transition hover:bg-white"
      (click)="searchThisArea()"
    >
      In diesem Bereich suchen
    </button>
  </div>
  }
</div>

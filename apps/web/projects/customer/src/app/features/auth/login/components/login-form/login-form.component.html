<div class="w-full max-w-sm">
  <div class="lg:hidden">
    <p class="text-xs font-semibold uppercase tracking-wide text-brand-600">
      Auto-Werkstatt
    </p>
  </div>

  <h1 class="mt-2 text-2xl font-semibold tracking-tight text-slate-900">
    Willkommen zurück
  </h1>
  <p class="mt-1 text-sm text-slate-500">
    Melde dich an, um deine Termine und Reparaturen zu sehen.
  </p>

  <form class="mt-8 space-y-5" [formGroup]="form" (ngSubmit)="submit()">
    <bo-text-field
      [control]="form.controls.email"
      label="E-Mail"
      type="email"
      icon="mail"
      autocomplete="username"
      placeholder="name@example.com"
      errorText="Bitte eine gültige E-Mail-Adresse eingeben."
    />

    <bo-text-field
      [control]="form.controls.password"
      label="Passwort"
      type="password"
      icon="lock"
      autocomplete="current-password"
      placeholder="••••••••"
      errorText="Bitte ein Passwort eingeben."
    />

    @if (error(); as message) {
      <bo-alert variant="error">{{ message }}</bo-alert>
    }

    <bo-button type="submit" [loading]="loading()" block>Anmelden</bo-button>
  </form>

  <p class="mt-8 text-center text-sm text-slate-500">
    Noch kein Konto?
    <a routerLink="/register" class="font-medium text-brand-600 hover:underline">
      Jetzt registrieren
    </a>
  </p>
</div>

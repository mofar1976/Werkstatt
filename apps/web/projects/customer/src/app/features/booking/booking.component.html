<div class="mx-auto max-w-2xl space-y-4">
  <a
    [routerLink]="['/workshops', workshopId()]"
    class="text-sm text-brand-600 hover:underline"
  >
    ← Zurück zur Werkstatt
  </a>

  @if (facade.loading()) {
    <div class="flex justify-center rounded-xl border border-slate-200 bg-white p-10 text-sm text-slate-400">
      <bo-spinner label="Lädt …" />
    </div>
  } @else if (facade.error(); as error) {
    <bo-alert variant="error">{{ error }}</bo-alert>
  } @else if (facade.workshop(); as workshop) {
    <cu-booking-summary [workshop]="workshop" />

    <section class="rounded-xl border border-slate-200 bg-white p-6">
      <h2 class="text-sm font-semibold text-slate-900">1. Termin wählen</h2>
      <div class="mt-3">
        <cu-slot-picker
          [slots]="facade.slots()"
          [selectedId]="selectedSlotId()"
          (select)="pickSlot($event)"
        />
      </div>
    </section>

    <section class="rounded-xl border border-slate-200 bg-white p-6">
      <h2 class="text-sm font-semibold text-slate-900">
        2. Fahrzeug &amp; Problem
      </h2>

      @if (facade.submitError(); as error) {
        <div class="mt-3">
          <bo-alert variant="error">{{ error }}</bo-alert>
        </div>
      }

      <div class="mt-3">
        <cu-booking-form
          [brands]="facade.brands()"
          [models]="facade.models()"
          [modelsLoading]="facade.modelsLoading()"
          [submitting]="facade.submitting()"
          [slotMissing]="!selectedSlotId()"
          (brandChange)="facade.selectBrand($event)"
          (save)="book($event)"
        />
      </div>
    </section>
  }
</div>

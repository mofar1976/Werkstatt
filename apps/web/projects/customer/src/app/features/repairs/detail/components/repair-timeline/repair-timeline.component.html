<div class="rounded-xl border border-slate-200 bg-white p-6">
  <h3 class="text-sm font-semibold text-slate-900">Verlauf</h3>

  <ol class="mt-4 space-y-4">
    @for (event of events(); track event.id) {
      <li class="flex gap-3">
        <div class="mt-1 flex flex-col items-center">
          <span class="h-2 w-2 rounded-full bg-brand-500"></span>
          @if (!$last) {
            <span class="mt-1 w-px flex-1 bg-slate-200"></span>
          }
        </div>
        <div class="pb-1">
          <p class="text-sm font-medium text-slate-800">{{ title(event) }}</p>
          @if (event.message) {
            <p class="mt-0.5 whitespace-pre-line text-sm text-slate-600">
              {{ event.message }}
            </p>
          }
          <p class="mt-0.5 text-xs text-slate-400">
            {{ when(event.createdAt) }} · {{ actor(event) }}
          </p>
        </div>
      </li>
    }
  </ol>
</div>

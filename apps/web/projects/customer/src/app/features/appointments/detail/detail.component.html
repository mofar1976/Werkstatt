<div class="space-y-4">
  <a routerLink="/appointments" class="text-sm text-brand-600 hover:underline">
    ← Zurück zu meinen Terminen
  </a>

  @if (facade.detailError(); as error) {
    <bo-alert variant="error">{{ error }}</bo-alert>
  }

  @if (facade.detailLoading() && !appointment()) {
    <div class="flex justify-center rounded-xl border border-slate-200 bg-white p-10 text-sm text-slate-400">
      <bo-spinner label="Lädt …" />
    </div>
  } @else if (appointment(); as a) {
    <cu-appointment-summary [appointment]="a" />

    @if (canCancel()) {
      <div class="flex justify-end">
        <bo-button
          variant="danger"
          size="sm"
          [loading]="facade.saving()"
          (click)="cancel()"
        >
          Termin stornieren
        </bo-button>
      </div>
    }
  }
</div>

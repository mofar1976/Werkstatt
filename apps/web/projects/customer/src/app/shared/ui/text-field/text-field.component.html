<div>
  @if (label()) {
    <label
      class="mb-1.5 block text-sm font-medium text-slate-700"
      [attr.for]="fieldId"
    >
      {{ label() }}
    </label>
  }

  <div class="relative">
    @switch (icon()) {
      @case ("mail") {
        <svg [class]="iconClass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2" />
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
        </svg>
      }
      @case ("lock") {
        <svg [class]="iconClass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
      }
      @case ("search") {
        <svg [class]="iconClass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
      }
    }

    <input
      [id]="fieldId"
      [type]="inputType()"
      [formControl]="control()"
      [placeholder]="placeholder()"
      [attr.autocomplete]="autocomplete() || null"
      [attr.aria-invalid]="showError() || null"
      [attr.aria-describedby]="showError() ? fieldId + '-error' : null"
      [class]="inputClass()"
    />

    @if (isPassword()) {
      <button
        type="button"
        tabindex="-1"
        (click)="toggleReveal()"
        [attr.aria-label]="revealed() ? 'Passwort verbergen' : 'Passwort anzeigen'"
        class="absolute right-2 top-1/2 -translate-y-1/2 rounded-md p-1.5 text-slate-400 transition hover:text-slate-600"
      >
        @if (revealed()) {
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
            <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
            <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
            <line x1="2" x2="22" y1="2" y2="22" />
          </svg>
        } @else {
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        }
      </button>
    }
  </div>

  @if (showError()) {
    <p [id]="fieldId + '-error'" class="mt-1.5 text-xs text-red-600">
      {{ errorMessage() }}
    </p>
  } @else if (hint()) {
    <p class="mt-1.5 text-xs text-slate-400">{{ hint() }}</p>
  }
</div>

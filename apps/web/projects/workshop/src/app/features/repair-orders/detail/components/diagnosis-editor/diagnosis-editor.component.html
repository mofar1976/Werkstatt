<form
  class="space-y-5 rounded-xl border border-slate-200 bg-white p-6"
  [formGroup]="form"
  (ngSubmit)="submitSave()"
>
  <div>
    <label class="mb-1.5 block text-sm font-medium text-slate-700" for="ro-cause">
      Ursache / Befund
    </label>
    <textarea
      id="ro-cause"
      rows="3"
      formControlName="cause"
      placeholder="Was ist die Ursache? Was wurde festgestellt?"
      class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100"
    ></textarea>
  </div>

  <div>
    <div class="mb-2 flex items-center justify-between">
      <span class="text-sm font-medium text-slate-700">Positionen</span>
      <button type="button" class="text-sm text-brand-600 hover:underline" (click)="addRow()">
        + Position
      </button>
    </div>

    <div class="space-y-2" formArrayName="lineItems">
      @for (row of lineItems.controls; track $index) {
        <div class="grid gap-2 rounded-lg border border-slate-200 p-2 sm:grid-cols-[9rem_1fr_5rem_7rem_2rem] sm:items-center" [formGroupName]="$index">
          <select
            formControlName="kind"
            class="rounded-lg border border-slate-300 bg-white px-2 py-2 text-sm outline-none focus:border-brand-500"
          >
            <option [value]="Kind.PART">Teil</option>
            <option [value]="Kind.LABOR">Arbeit</option>
          </select>

          <div class="flex flex-col gap-1">
            <input
              type="text"
              formControlName="description"
              placeholder="Bezeichnung"
              class="rounded-lg border border-slate-300 px-2 py-2 text-sm outline-none focus:border-brand-500"
            />
            @if (row.get("kind")?.value === Kind.PART) {
              <select
                formControlName="partAction"
                class="rounded-lg border border-slate-200 bg-white px-2 py-1.5 text-xs text-slate-600 outline-none"
              >
                <option [value]="Action.REPLACE">ersetzen</option>
                <option [value]="Action.REPAIR">reparieren</option>
              </select>
            }
          </div>

          <input
            type="number"
            step="0.5"
            min="0"
            formControlName="quantity"
            [attr.aria-label]="'Menge'"
            class="rounded-lg border border-slate-300 px-2 py-2 text-right text-sm tabular-nums outline-none focus:border-brand-500"
          />

          <div class="flex items-center gap-1">
            <input
              type="number"
              step="0.01"
              min="0"
              formControlName="unitPriceEur"
              [attr.aria-label]="'Einzelpreis in Euro (netto)'"
              class="w-full rounded-lg border border-slate-300 px-2 py-2 text-right text-sm tabular-nums outline-none focus:border-brand-500"
            />
            <span class="text-xs text-slate-400">€</span>
          </div>

          <button
            type="button"
            (click)="removeRow($index)"
            aria-label="Position entfernen"
            class="justify-self-center rounded p-1 text-slate-400 hover:bg-slate-100 hover:text-red-600"
          >
            ✕
          </button>
        </div>
      }
    </div>
    <p class="mt-1 text-xs text-slate-400">Einzelpreise netto.</p>
  </div>

  <div class="flex flex-wrap items-end gap-4">
    <div>
      <label class="mb-1.5 block text-sm font-medium text-slate-700" for="ro-tax">
        MwSt (%)
      </label>
      <input
        id="ro-tax"
        type="number"
        step="1"
        min="0"
        max="25"
        formControlName="taxRatePercent"
        class="w-24 rounded-lg border border-slate-300 px-2 py-2 text-right text-sm tabular-nums outline-none focus:border-brand-500"
      />
    </div>
    <div class="text-sm text-slate-500">
      Vorschau gesamt (brutto):
      <span class="font-semibold text-slate-900">{{ eur(grossPreview()) }}</span>
    </div>
  </div>

  <div>
    <label class="mb-1.5 block text-sm font-medium text-slate-700" for="ro-notes">
      Hinweis an die Kundschaft (optional)
    </label>
    <textarea
      id="ro-notes"
      rows="2"
      formControlName="notes"
      class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100"
    ></textarea>
  </div>

  <div class="flex flex-wrap items-center gap-3 pt-1">
    <bo-button type="submit" variant="secondary" [loading]="saving()">
      Befund speichern
    </bo-button>
    <bo-button
      type="button"
      [disabled]="!canSend()"
      [loading]="saving()"
      (click)="send.emit()"
    >
      Kostenvoranschlag senden
    </bo-button>
    @if (!canSend()) {
      <span class="text-xs text-slate-400">
        Erst Ursache + mindestens eine Position speichern.
      </span>
    }
  </div>
</form>

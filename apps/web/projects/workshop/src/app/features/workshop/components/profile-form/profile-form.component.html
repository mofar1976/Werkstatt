<form
  class="space-y-5 rounded-xl border border-slate-200 bg-white p-6"
  [formGroup]="form"
  (ngSubmit)="submit()"
>
  <bo-text-field [control]="form.controls.name" label="Name" />

  <div>
    <label class="mb-1.5 block text-sm font-medium text-slate-700" for="ws-desc">
      Beschreibung
    </label>
    <textarea
      id="ws-desc"
      rows="3"
      formControlName="description"
      class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100"
    ></textarea>
  </div>

  <div class="grid gap-5 sm:grid-cols-2">
    <bo-text-field [control]="form.controls.email" label="E-Mail" type="email" icon="mail" />
    <bo-text-field [control]="form.controls.phone" label="Telefon" type="tel" />
  </div>

  <fieldset formGroupName="address" class="grid gap-5 sm:grid-cols-2">
    <legend class="mb-1 text-sm font-semibold text-slate-900">Adresse</legend>
    <bo-text-field [control]="form.controls.address.controls.street" label="Straße & Nr." />
    <bo-text-field [control]="form.controls.address.controls.city" label="Stadt" />
    <bo-text-field [control]="form.controls.address.controls.postalCode" label="PLZ" />
    <bo-text-field [control]="form.controls.address.controls.country" label="Land (ISO-2)" />
  </fieldset>

  <p class="text-xs text-slate-400">
    Freischaltung, Slug und Standort-Koordinaten werden vom Plattform-Team gepflegt.
  </p>

  <div class="flex items-center gap-3 pt-2">
    <bo-button type="submit" [loading]="saving()">Speichern</bo-button>
    <button
      type="button"
      class="text-sm text-slate-500 hover:text-slate-700"
      (click)="cancel.emit()"
    >
      Abbrechen
    </button>
  </div>
</form>

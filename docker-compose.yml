services:
  mongo:
    # Single-node replica set (rs0) so multi-document transactions work.
    # Runs on 27018 (host 27017 is often taken by a local MongoDB install);
    # the port is kept identical inside and outside so the replica-set member
    # address ("localhost:27018") resolves the same everywhere.
    image: mongo:8
    container_name: car-garage-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    ports:
      - "27018:27018"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Initiates the replica set on first start, then reports healthy.
      test: >
        mongosh --quiet --port 27018 --eval "
        try { rs.status().ok }
        catch (e) {
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27018' }] }).ok
        }"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: car-garage-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket used for vehicle / damage photos on startup.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/car-garage &&
      mc anonymous set download local/car-garage
      "

volumes:
  mongo_data:
  minio_data:
